<script>
// One statistics request per page load; scene navigation does not reload this script.
(function(){
 if(window.medlingoVisitCounterStarted)return;
 window.medlingoVisitCounterStarted=true;
 const count=document.getElementById('busuanzi_page_pv');
 const status=document.getElementById('medlingo-visit-status');
 if(location.hostname!=='maggiedu-u.github.io'){
  status.textContent='本地预览不计数，请在正式游戏网址查看';return;
 }
 const numeric=()=>/^\d[\d,\s]*$/.test(count.textContent.trim());
 function showResult(){if(numeric())status.textContent='';}
 new MutationObserver(showResult).observe(count,{childList:true,subtree:true,characterData:true});
 const script=document.createElement('script');
 script.src='https://busuanzi.9420.ltd/js';
 script.defer=true;
 script.onerror=()=>{status.textContent='统计暂不可用，不影响游戏';};
 setTimeout(()=>{if(!numeric())status.textContent='统计暂不可用，不影响游戏';},12000);
 document.body.appendChild(script);
})();
</script>
